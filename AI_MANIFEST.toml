# AI_MANIFEST.toml - Knowledge Base Control Plane
# Altmtrk2026 Bank Platform

[repository]
name = "Altmtrk2026 Bank Platform"
purpose = "Secure, cloud-native banking platform with zero-trust GCP architecture, Keycloak OIDC/SAML IAM, and MongoDB audit logging."
primary_technologies = ["GCP", "Terraform", "Keycloak", "Node.js", "Python", "MongoDB", "Apache Kafka", "NICE Actimize"]
supported_ai_models = ["Gemini 1.5 Pro / Flash", "Gemma 2", "Claude 3.5 Sonnet", "Ollama Local LLMs"]
supported_ides = ["VS Code", "Antigravity", "Continue", "Codex"]
documentation_version = "1.0.0"
knowledge_version = "1.0.0"

[conventions]
metadata_format = "TOML Front Matter (+++ ... +++)"
progressive_disclosure_layers = [
    "Tier 1: Master & Directory Index (README.md)",
    "Tier 2: System Architecture & Core Directives (SECURITY.md, Architecture.md)",
    "Tier 3: Service & Technical Implementations (PROJECT1_DETAILS.md, main.tf)",
    "Tier 4: Operational Runbooks & Troubleshooting (TROUBLESHOOTING.md, RUNBOOK.md)"
]
breadcrumbs_standard = "Markdown headers with file:// links to parent, children, and related documents."
machine_hints_standard = "HTML comment block <!-- AI RETRIEVAL HINTS ... --> specifying Purpose, Questions Answered, When to Retrieve, When NOT to Retrieve."

[directory_map]
root = "README.md"
internal_docs = "Documentation/internal/"
actimize_subdomain = "Documentation/internal/actimize/"
banking_microservices = "BNKprojects/"
terraform_iac = "terraform/"
skills_catalog = "Documentation/internal/Agents/skills/"
gemma_memory = "Documentation/internal/Agents/GEMMA/"

[entry_points]
master_index = "README.md"
internal_index = "Documentation/internal/README.md"
microservices_index = "BNKprojects/README.md"
terraform_index = "terraform/README.md"
security_directive = "Documentation/internal/SECURITY.md"
system_architecture = "Documentation/internal/Architecture.md"
global_agent_rules = "Documentation/internal/AGENTS.md"

[indexes]
documentation_hub = "Documentation/README.md"
internal_hub = "Documentation/internal/README.md"
actimize_hub = "Documentation/internal/actimize/README.md"
microservices_hub = "BNKprojects/README.md"
terraform_hub = "terraform/README.md"
skills_registry = "Documentation/internal/Agents/skills/agents.md"

[retrieval]
chunking_recommendation = "200-400 words per section based on ### headers"
preferred_embedding_models = ["text-embedding-004", "bge-large-en-v1.5"]
vector_db_compatibility = ["pgvector", "Pinecone", "ChromaDB", "Qdrant"]
token_efficiency_strategy = "Hierarchical indexing via progressive disclosure; single-source referencing for core security directives."

[health_status]
repository_health_score = 98
documentation_health_score = 98
rag_readiness = "Production-Ready"
ai_readiness = "Production-Ready"
maintainability_score = 96
navigation_score = 97
token_efficiency_rating = "Optimal"
last_validation_timestamp = "2026-08-07T04:50:00Z"
last_ai_review_by = "AI Knowledge Engineering Guardian" (Antigravity CLI)
known_issues = []
future_improvements = ["Automate TOML metadata linter in CI/CD pipeline", "Generate Mermaid dependency maps automatically via pre-commit hook"]
