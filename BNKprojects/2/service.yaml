apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: transaction-service
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/vpc-access-connector: avechector
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      containers:
        - image: transaction-service-image
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: transaction-service-db-connection-string
                  key: latest
