name: CI - Foundation Validation
on:
  pull_request:
    branches: [ DEV ]
    paths:
      - 'terraform/**'

permissions:
  contents: write
  id-token: write

jobs:
  auto-fix:
    name: Auto-fix Formatting & Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -recursive terraform/

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated fix for formatting/dependencies [skip ci]"

  terraform-plan:
    name: 'Terraform Plan'
    needs: auto-fix
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          # Use a heredoc to prevent shell quote stripping
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF

          # Verify dev.tfvars was created successfully before proceeding
          if [ ! -f "dev.tfvars" ]; then
            echo "Error: Failed to create dev.tfvars from secrets."
            exit 1
          fi

          # Sanitize Project ID and initialize
          CLEAN_PROJECT=$(echo "${{ secrets.GCP_BACKEND_PROJECT_ID }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          
          # Explicitly provide backend config to ensure the remote state is found
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project"
          
          terraform workspace select -or-create projectZERO

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var-file="dev.tfvars" \
            -target=module.project0