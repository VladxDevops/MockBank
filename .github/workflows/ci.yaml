name: CI - Foundation Validation
on:
  pull_request:
    branches: [ DEV, ]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan
        run: |
          cd terraform
          terraform init -input=false \
          -backend-config="bucket=terraform_state_bckup_bnk-project" \
          -backend-config="project=bankproject-486308"
          terraform validate
          terraform workspace select projectZERO || terraform workspace new projectZERO
          terraform plan -var-file="dev.tfvars" -target=module.project0