name: CI - Foundation Validation
on:
  pull_request:
    branches: [ DEV, ]
    paths:
      - 'terraform/**'

permissions:
  contents: write
  id-token: write

jobs:
  auto-fix:
    name: Auto-fix Formatting & Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -recursive terraform/

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated fix for formatting/dependencies [skip ci]"

  terraform-plan:
    name: 'Terraform Plan'
    needs: auto-fix
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan
        run: |
          cd terraform
          # Use a heredoc to prevent shell quote stripping
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF
          terraform init -input=false -reconfigure -backend-config="project=${{ secrets.GCP_BACKEND_PROJECT_ID }}"
          terraform validate
          # Using -or-create flag to handle workspace existence silently.
          terraform workspace select -or-create projectZERO

          # Ensure dev.tfvars exists before planning. 
          # If this fails, verify dev.tfvars is committed or provided via GitHub Secrets.
          if [ -f "dev.tfvars" ]; then
            terraform plan -var-file="dev.tfvars" -target=module.project0
          else
            echo "Error: dev.tfvars not found in terraform/ directory. Check .gitignore or repository structure."
            exit 1
          fi