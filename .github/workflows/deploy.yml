name: Project 3 - CI/CD Release Safety

on:
  push:
    branches: [ "DEV", "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  sast-scan:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/nodejs

  build-and-release:
    name: Build and Trigger Cloud Deploy
    needs: sast-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GCP_REGION: ${{ vars.GCP_DEPLOY_REGION }} #Create github secret, pending.
      PIPELINE_NAME: transaction-service-pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Create Cloud Deploy Release
        run: |
          gcloud deploy releases create "rel-${{ github.run_number }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --delivery-pipeline="${{ env.PIPELINE_NAME }}" \
            --source="BNKprojects/2"
