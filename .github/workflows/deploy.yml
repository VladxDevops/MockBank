name: Project 3 - CI/CD Release Safety

on:
  push:
    branches: [ "DEV", "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  id-token: write

jobs:
  auto-fix:
    name: Auto-fix Formatting & Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/DEV'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -recursive terraform/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Audit Fix
        run: |
          cd BNKprojects/2
          npm audit fix || echo "Manual intervention required for some vulnerabilities"

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated fix for formatting/dependencies [skip ci]"

  terraform-plan:
    name: Terraform Plan (Identity GitOps)
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Plan
        run: |
          cd terraform
          terraform init
          terraform plan -lock=false \
            -var="keycloak_admin_password=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            -var="compute_project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="compute_region=${{ vars.GCP_COMPUTE_REGION }}" \
            -var="atlas_org_id=${{ vars.ATLAS_ORG_ID }}" \
            -var="compute_project_number=${{ vars.GCP_PROJECT_NUMBER }}" \
            -out=tfplan

  sast-scan:
    name: Security Scan (SAST)
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/nodejs

  unit-tests:
    name: Unit Tests (Project 2)
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BNKprojects/2/package*.json

      - name: Install dependencies
        run: cd BNKprojects/2 && npm ci

      - name: Run tests
        run: cd BNKprojects/2 && npm test || echo "No tests defined yet"

  dependency-scan:
    name: Dependency Audit
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js Audit
        run: |
          cd BNKprojects/2
          # Fails on high/critical vulnerabilities
          npm audit --audit-level=high

  build-and-release:
    name: Build and Trigger Cloud Deploy
    needs: [sast-scan, unit-tests, dependency-scan]
    environment: DEV
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GCP_REGION: ${{ vars.GCP_COMPUTE_REGION }}
      PIPELINE_NAME: transaction-service-pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Create Cloud Deploy Release
        run: |
          gcloud deploy releases create "rel-${{ github.run_number }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --delivery-pipeline="${{ env.PIPELINE_NAME }}" \
            --source="BNKprojects/2"

  release-identity:
    name: Build and Deploy Project 1 (Identity)
    needs: [terraform-plan, sast-scan]
    environment: DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/DEV'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Keycloak Image
        run: |
          cd BNKprojects/1/container
          # Using github.sha as a tag ensures immutable releases and triggers Cloud Run revisions correctly
          gcloud builds submit --tag "${{ vars.GCP_COMPUTE_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/main-repository/keycloak:${{ github.sha }}" .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply (Project 1)
        run: |
          cd terraform
          terraform init
          # Targeted apply ensures we only update Keycloak and its dependencies
          terraform apply -auto-approve -lock=false \
            -target=module.project1 \
            -var="keycloak_admin_password=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            -var="compute_project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="compute_region=${{ vars.GCP_COMPUTE_REGION }}" \
            -var="atlas_org_id=${{ vars.ATLAS_ORG_ID }}" \
            -var="compute_project_number=${{ vars.GCP_PROJECT_NUMBER }}" \
            -var="docker_image=${{ vars.GCP_COMPUTE_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/main-repository/keycloak:${{ github.sha }}"
