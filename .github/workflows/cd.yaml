name: CD - Foundation Deployment
on:
  workflow_dispatch:
  push:
    branches: [ DEV ]
    paths:
      - 'terraform/**'
      - 'BNKprojects/1/container/**'
      - 'BNKprojects/3/**'

# Prevent concurrent runs from locking the same Terraform state
concurrency:
  group: terraform-state-lock-${{ github.ref }}
  cancel-in-progress: false

permissions: # Grant write permissions for auto-commit action
  contents: write
  id-token: write

jobs:
  auto-fix:
    name: Auto-fix Formatting & Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -recursive terraform/

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated fix for formatting/dependencies [skip ci]"

  terraform-plan:
    name: 'Terraform Plan'
    needs: auto-fix
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF

          if [ ! -f "dev.tfvars" ]; then
            echo "Error: Failed to create dev.tfvars from secrets."
            exit 1
          fi

          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project" \
            -lock-timeout=20m
          
          terraform workspace select -or-create projectZERO

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -input=false \
            -var-file="dev.tfvars" \
            -target=module.project0

  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          # Materialize secrets to tfvars
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF

          if [ ! -f "dev.tfvars" ]; then
            echo "Error: Failed to create dev.tfvars from secrets."
            exit 1
          fi

          # Sanitize Project ID for backend
          CLEAN_PROJECT=$(echo "${{ secrets.GCP_BACKEND_PROJECT_ID }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          
          # Explicitly provide backend config to ensure remote state alignment
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project" \
            -lock-timeout=20m

          
          terraform workspace select -or-create projectZERO

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -input=false \
            -lock-timeout=20m \
            -var-file="dev.tfvars" \
            -target=module.project0

  build-keycloak:
    name: 'Build and Push Keycloak'
    runs-on: 'ubuntu-latest'
    environment: DEV
    needs: terraform-apply
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Google Auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Set GCP Project'
        working-directory: BNKprojects/1/container
        run: 'gcloud config set project ${{ secrets.DEV_GCP_PROJECT_ID }}'

      - name: Create Keycloak Realm Placeholder
        working-directory: BNKprojects/1/container
        run: |
          # This satisfies the Docker COPY command without baking real config into the image
          echo '{"realm": "Mockbankrealm", "enabled": true}' > realm-export.json


      - name: 'Build and Push' 
        working-directory: BNKprojects/1/container
        run: |
          gcloud builds submit --tag "us-south1-docker.pkg.dev/${{ secrets.DEV_GCP_PROJECT_ID }}/${{ secrets.PROJECT1_REPOSITORY }}/keycloak:v1" .

  build-transaction-service:
    name: 'Build Transaction Service'
    runs-on: ubuntu-latest
    environment: DEV
    needs: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Build and Push Image
        working-directory: BNKprojects/2/container
        run: |
          # We use the full SHA for the image tag to ensure immutability
          IMAGE_URL="us-south1-docker.pkg.dev/${{ secrets.DEV_GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPOSITORY_ID }}/transaction-service:${{ github.sha }}"
          gcloud builds submit --tag "$IMAGE_URL"
          # Export the image URL for the release job
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

  deploy-identity:
    name: 'Deploy Identity Service'
    runs-on: ubuntu-latest
    environment: DEV
    needs: build-keycloak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF
          
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project" \
            -lock-timeout=20m
          
          terraform workspace select -or-create projectZERO

      - name: Terraform Apply (Project 1)
        working-directory: ./terraform
        run: |
          # Now we deploy the actual Cloud Run service using the v1 image
          terraform apply -auto-approve \
            -input=false \
            -lock-timeout=20m \
            -var-file="dev.tfvars" \
            -target=module.project1

  configure-identity:
    name: 'Identity Config (Project 3)'
    runs-on: ubuntu-latest
    environment: DEV
    needs: deploy-identity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Install Cloud Run Proxy Component'
        run: gcloud components install cloud-run-proxy --quiet

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 'Start GCloud Proxy'
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          # Start the proxy in the background
          # We use 127.0.0.1 explicitly to avoid localhost resolution issues in some environments
          gcloud run services proxy keycloak-service --region us-south1 --port 8080 --quiet &
          
          # Wait for the proxy to be ready (up to 120s)
          echo "Waiting for proxy to respond on http://127.0.0.1:8080/health/live..."
          for i in {1..60}; do
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 5 http://127.0.0.1:8080/health/live || echo "CONN_FAILED 000")
            CODE=$(echo "$RESPONSE" | tail -n 1)
            
            # Match "UP" within the entire response to handle multi-line JSON output correctly
            if [[ "$CODE" == "200" ]] && echo "$RESPONSE" | grep -q "UP"; then
              echo "Proxy is successfully tunnelled and Keycloak is healthy (HTTP $CODE)."
              exit 0
            fi
            
            # Log the current status code for debugging
            echo -n "$CODE "
            sleep 2
          done
          
          echo -e "\nERROR: Proxy or Keycloak health check timed out."
          # Final diagnostic check
          curl -v http://127.0.0.1:8080/health/live || true
          exit 1

      - name: 'Configure Identity (Terraform Apply)'
        working-directory: ./terraform
        env:
          TF_VAR_keycloak_url: "http://127.0.0.1:8080"
        run: |
          # Materialize secrets to dev.tfvars
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF
          
          # Run Terraform commands to configure Keycloak via the active proxy
          # We explicitly pass -var="keycloak_url=..." to override the value defined in dev.tfvars
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project" \
            -lock-timeout=20m
          
          terraform workspace select -or-create projectZERO
          
          terraform plan -input=false -lock-timeout=20m -var-file="dev.tfvars" -var="keycloak_url=http://127.0.0.1:8080" -target=module.project3
          
          terraform apply -auto-approve \
            -input=false \
            -lock-timeout=20m \
            -var-file="dev.tfvars" \
            -var="keycloak_url=http://127.0.0.1:8080" \
            -target=module.project3

  release-transaction-service:
    name: 'Release Transaction Service'
    runs-on: ubuntu-latest
    environment: DEV
    needs: [configure-identity, build-transaction-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Create Cloud Deploy Release
        working-directory: BNKprojects/2
        run: |
          # Use the short SHA for the release name and map the image to the skaffold placeholder
          RELEASE_ID="rel-${GITHUB_SHA:0:7}"
          IMAGE_URL="us-south1-docker.pkg.dev/${{ secrets.DEV_GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPOSITORY_ID }}/transaction-service:${{ github.sha }}"
          
          gcloud deploy releases create "$RELEASE_ID" \
            --delivery-pipeline="transaction-service-pipeline" \
            --region="${{ vars.GCP_COMPUTE_REGION }}" \
            --images="transaction-service=$IMAGE_URL"