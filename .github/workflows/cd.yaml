name: CD - Foundation Deployment
on:
  push:
    branches: [ DEV ]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform validate
          terraform init \
          -backend-config="bucket=terraform_state_bckup_bnk-project" \
          -backend-config="project=bankproject-486308"
          terraform workspace select projectZERO || terraform workspace new projectZERO
          terraform apply -auto-approve -var-file="dev.tfvars" -target=module.project0

      - name: Create Cloud Deploy Release
        run: |
          gcloud deploy releases create release-${{ github.run_id }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.GCP_COMPUTE_REGION }} \
            --delivery-pipeline=transaction-service-pipeline \
            --source=BNKprojects/2/
          terraform workspace select projectZERO || terraform workspace new projectZERO
          terraform apply -auto-approve var-file="dev.tfvars" -target=module.project0
          terraform apply -auto-approve -var-file="dev.tfvars" -target=module.project0

      - name: Create Cloud Deploy Release
        run: |
          gcloud deploy releases create release-${{ github.run_id }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.GCP_COMPUTE_REGION }} \
            --delivery-pipeline=transaction-service-pipeline \
            --source=BNKprojects/2/
