name: CD - Foundation Deployment
on:
  push:
    branches: [ DEV ]
    paths:
      - 'terraform/**'

permissions:
  contents: write
  id-token: write

jobs:
  auto-fix:
    name: Auto-fix Formatting & Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -recursive terraform/

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated fix for formatting/dependencies [skip ci]"

  terraform-apply:
    name: 'Terraform Apply'
    needs: auto-fix
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          # Use a heredoc to prevent shell quote stripping
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF
          terraform init -input=false -reconfigure
          terraform validate
          # Using -or-create flag to handle workspace existence silently.
          terraform workspace select -or-create projectZERO

          if [ -f "dev.tfvars" ]; then
            terraform apply -auto-approve -var-file="dev.tfvars" -target=module.project0
          else
            echo "Error: dev.tfvars not found in terraform/ directory."
            exit 1
          fi
