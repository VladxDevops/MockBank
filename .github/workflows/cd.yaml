name: CD - Foundation Deployment
on:
  push:
    branches: [ DEV ]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          # Materialize secrets to tfvars
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF

          if [ ! -f "dev.tfvars" ]; then
            echo "Error: Failed to create dev.tfvars from secrets."
            exit 1
          fi

          # Sanitize Project ID for backend
          CLEAN_PROJECT=$(echo "${{ secrets.GCP_BACKEND_PROJECT_ID }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          
          # Explicitly provide backend config to ensure remote state alignment
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project"

          
          terraform workspace select -or-create projectZERO

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var-file="dev.tfvars" \
            -target=module.project0