name: CD - Foundation Deployment
on:
  push:
    branches: [ DEV ]
    paths:
      - 'terraform/**'
      - 'BNKprojects/1/container/**'
      - 'BNKprojects/3/**'

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          # Materialize secrets to tfvars
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF

          if [ ! -f "dev.tfvars" ]; then
            echo "Error: Failed to create dev.tfvars from secrets."
            exit 1
          fi

          # Sanitize Project ID for backend
          CLEAN_PROJECT=$(echo "${{ secrets.GCP_BACKEND_PROJECT_ID }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          
          # Explicitly provide backend config to ensure remote state alignment
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project"

          
          terraform workspace select -or-create projectZERO

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var-file="dev.tfvars" \
            -target=module.project0

  build-keycloak:
    name: 'Build and Push Keycloak'
    runs-on: 'ubuntu-latest'
    environment: DEV
    needs: terraform-apply
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Google Auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Set GCP Project'
        run: 'gcloud config set project ${{ secrets.GCP_PROJECT_ID }}'

      - name: Create Keycloak Realm Placeholder
        run: |
          # This satisfies the Docker COPY command without baking real config into the image
          echo '{"realm": "AltmtrkBank", "enabled": true}' > BNKprojects/1/container/realm-export.json


      - name: 'Build and Push' 
        working-directory: BNKprojects/1/container
        run: |
          gcloud builds submit --tag "us-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/bank-apps-registry/keycloak:v1" ./BNKprojects/1/container

  deploy-identity:
    name: 'Deploy Identity Service'
    runs-on: ubuntu-latest
    environment: DEV
    needs: build-keycloak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF
          
          # Sanitize Project ID for backend consistency
          CLEAN_PROJECT=$(echo "${{ secrets.GCP_BACKEND_PROJECT_ID }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project"
          
          terraform workspace select -or-create projectZERO

      - name: Terraform Apply (Project 1)
        working-directory: ./terraform
        run: |
          # Now we deploy the actual Cloud Run service using the v1 image
          terraform apply -auto-approve \
            -var-file="dev.tfvars" \
            -target=module.project1

  configure-identity:
    name: 'Identity Config (Project 3)'
    runs-on: ubuntu-latest
    environment: DEV
    needs: deploy-identity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          cat <<'EOF' > dev.tfvars
          ${{ secrets.TFVARS_DEV }}
          EOF
          
          terraform init -input=false -reconfigure \
            -backend-config="bucket=terraform_state_bckup_bnk-project"
          
          terraform workspace select -or-create projectZERO

      - name: Terraform Plan (Project 3)
        working-directory: ./terraform
        run: terraform plan -var-file="dev.tfvars" -target=module.project3

      - name: Terraform Apply (Project 3)
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var-file="dev.tfvars" \
            -target=module.project3